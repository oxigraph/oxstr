name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --all-targets -- -D warnings -D clippy::all
      - run: cargo clippy --all-targets --no-default-features -- -D warnings -D clippy::all
      - run: cargo clippy --all-targets --features serde -- -D warnings -D clippy::all
      - run: cargo clippy --all-targets --no-default-features --features serde -- -D warnings -D clippy::all

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --no-default-features
      - run: cargo test
      - run: cargo test --features serde

  test_32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: rustup target add i686-unknown-linux-gnu
      - run: sudo apt-get update
      - run: sudo apt-get install --yes gcc-multilib
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --target i686-unknown-linux-gnu

  test_msv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: rustup override set 1.85.0
      - run: rustup toolchain install nightly
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo +nightly update -Z direct-minimal-versions
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - run: cargo test

  test_miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - run: rustup override set nightly
      - run: rustup component add miri
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo miri test

  rustdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.31
        with: { tool: cargo-deny }
      - run: cargo deny check

  semver_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with: { tool: cargo-semver-checks }
      - run: cargo semver-checks check-release

  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2.87.31
        with: { tool: typos-cli }
      - run: typos

  codspeed:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with: { tool: cargo-codspeed }
      - run: cargo codspeed build
      - uses: CodSpeedHQ/action@v5.6.0
        with:
          run: cargo codspeed run
          mode: simulation

  codecov:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with: { tool: cargo-llvm-cov }
      - run: cargo llvm-cov --all-features --codecov --output-path codecov.json
      - uses: codecov/codecov-action@v7.1.1
        with:
          files: codecov.json
          flags: rust
          fail_ci_if_error: true
          use_oidc: true

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.9.0
        with:
          strict-collection: true
